# .github/workflows/sync-clean-branch.yml
#
# main 브랜치에 push(=PR 머지 포함)될 때마다 자동으로 실행되어
# .meta 파일, 대용량 바이너리 에셋, 빌드/캐시 폴더를 제거한
# "clean-context" 브랜치를 생성/갱신합니다.
# 이 브랜치를 Claude Projects의 GitHub 연동 대상으로 사용하세요.
#
# 중요: clean-context는 매번 "orphan 브랜치"로 새로 만듭니다.
# 즉 main과 커밋 히스토리를 전혀 공유하지 않습니다.
# 이렇게 하면 누가 실수로 clean-context를 merge하거나 그 위에서
# 브랜치를 따더라도 git이 "unrelated histories"로 바로 거부하기 때문에,
# 정상적인 기능 브랜치 -> main PR의 diff에는 clean-context의 변경사항이
# 섞여 들어올 수 없습니다.
#
# 설정 시 확인할 것:
# 1) 기본 브랜치 이름이 main이 아니라면 아래 `branches: [main]` 을 실제 이름으로 수정
# 2) 저장소 Settings > Actions > General > Workflow permissions 를
#    "Read and write permissions" 로 설정 (그래야 봇이 새 브랜치에 push 가능)

name: Sync Clean Context Branch

on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능 (최초 브랜치 생성용)

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean tree (orphan branch)
        run: |
          git config user.name "clean-context-bot"
          git config user.email "actions@users.noreply.github.com"

          # main과 히스토리를 공유하지 않는 완전히 새로운 orphan 브랜치를
          # 매번 처음부터 다시 만듭니다. (이전 clean-context 히스토리는 버림)
          git checkout --orphan clean-context-build

          # 인덱스만 비우고 작업 트리 파일은 그대로 둠
          git rm -rf --cached . > /dev/null

          # .meta 파일 제거
          find . -type f -name "*.meta" -delete

          # 대용량/바이너리 에셋 제거 (프로젝트에 맞게 확장자 조정)
          find Assets -type f \( \
            -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o \
            -iname "*.psd" -o -iname "*.tga" -o -iname "*.fbx" -o \
            -iname "*.wav" -o -iname "*.mp3" -o -iname "*.ogg" -o \
            -iname "*.mp4" -o -iname "*.anim" -o -iname "*.controller" -o \
            -iname "*.unity" -o -iname "*.prefab" -o -iname "*.mat" -o \
            -iname "*.asset" \
          \) -delete 2>/dev/null || true

          # 빌드/캐시 폴더 제거
          rm -rf Library Temp Obj Build Logs UserSettings

          git add -A
          git commit -m "chore: rebuild clean context (orphan) from main ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # 원격의 기존 clean-context를 이 새 orphan 히스토리로 완전히 교체
          git push origin clean-context-build:clean-context --force
          git push origin --delete clean-context-build 2>/dev/null || true
